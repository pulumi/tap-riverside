version: 1
send_anonymous_usage_stats: false
default_environment: dev
project_id: tap-riverside
environments:
- name: dev
plugins:
  extractors:
  - name: tap-riverside
    namespace: tap_riverside
    # Local dev: install this working tree. Point at the git tag in dwh-workflows.
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    settings_group_validation:
    - [api_key, event_ids]
    settings:
    - name: api_key
      sensitive: true
    - name: api_url
    - name: event_ids
      kind: array
    - name: page_size
      kind: integer
    config:
      api_url: https://platform.riverside.fm
    metadata:
      '*':
        table-key-properties: []
        key-properties: []
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
